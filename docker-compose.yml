version: '3.8'

services:
  # 前端和后端服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - rednote-network
    container_name: rednote-assistent

networks:
  rednote-network:
    driver: bridge
